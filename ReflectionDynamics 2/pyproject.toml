[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflection-dynamics"
version = "0.5.0"
description = "Counterfactual value learning and controlled reflection experiments"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "pandas>=2.1,<3", "matplotlib>=3.8,<4", "torch>=2.5,<3", "safetensors>=0.5"]

[project.optional-dependencies]
research = ["transformers==4.57.6", "datasets>=3.3,<5", "accelerate>=1.8,<2", "math-verify[antlr4_13_2]>=0.7,<1", "peft==0.19.1"]
train = ["transformers==4.57.6", "datasets>=3.3,<5", "accelerate>=1.8,<2", "math-verify[antlr4_13_2]>=0.7,<1", "trl==0.27.1", "peft==0.19.1", "deepspeed==0.19.2"]
test = ["pytest>=8,<10"]

[project.scripts]
rd = "refldyn.cli:main"
rd5 = "cavr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_v5"]
addopts = "-q"
