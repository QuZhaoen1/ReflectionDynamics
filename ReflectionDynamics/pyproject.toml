[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflection-dynamics"
version = "0.4.0"
description = "Causal evaluation of reflection selection across reinforcement-learning checkpoints"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "pandas>=2.1,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
research = ["torch>=2.5,<3", "transformers>=4.56,<5", "datasets>=3.3,<5", "accelerate>=1.8,<2", "math-verify[antlr4_13_2]>=0.7,<1"]
train = ["torch>=2.5,<3", "transformers>=4.56,<5", "datasets>=3.3,<5", "accelerate>=1.8,<2", "math-verify[antlr4_13_2]>=0.7,<1", "trl==0.27.1", "peft>=0.18,<0.22", "deepspeed>=0.16,<0.21", "safetensors>=0.5"]
test = ["pytest>=8,<10"]

[project.scripts]
rd = "refldyn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
